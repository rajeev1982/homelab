apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bastion
  namespace: default
  labels:
    app: bastion
spec:
  serviceName: bastion
  replicas: 1
  selector:
    matchLabels:
      app: bastion
  template:
    metadata:
      labels:
        app: bastion
    spec:
      containers:
        - name: bastion
          # image: binlab/bastion:1.2.0
          image: funistoeng/procure:bastion-latest
          env:
            # - name: AUTHORIZED_KEYS
            #   value: /var/lib/bastion/authorized_keys
            - name: PUBKEY_AUTHENTICATION
              value: "yes"
            - name: TCP_FORWARDING
              value: "yes"
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: LISTEN_PORT
              value: "22"
          ports:
            - containerPort: 22
              name: service-port
          volumeMounts:
            - name: authorized-keys
              mountPath: /var/lib/bastion/authorized_keys
              subPath: authorized_keys
              readOnly: true
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"
      volumes:
        - name: authorized-keys
          configMap:
            name: bastion-authorized-keys
            items:
              - key: authorized_keys
                path: authorized_keys

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bastion-authorized-keys
  namespace: default
data:
  authorized_keys: |
    ssh-rsa  rajeev1982@gmail.com
    ssh-rsa  ivasharma0107@gmail.com

---
apiVersion: v1
kind: Service
metadata:
  name: bastion
  namespace: default
spec:
  type: NodePort
  selector:
    app: bastion
  ports:
    - name: bastion
      targetPort: service-port
      port: 22
      protocol: TCP
      nodePort: 30022
